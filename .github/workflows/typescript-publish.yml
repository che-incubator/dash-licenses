name: Build and publish project to npmjs

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: 'If true, buld and release version that is specified in package.json. Otherwise, build the next version instead'
        type: boolean
        default: false
        required: true
  push:
    branches: 
      - main
    tags:
      - '2.*.*'

permissions:
  id-token: write  # Required for publishing to npmjs
  contents: read


concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    name: Publish @eclipse-che/license-tool
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RELEASE_MODE: ${{ github.event.inputs.release-mode }}
    steps:
      - name: Display workflow parameters
        run: |
          echo "=== Workflow Parameters ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: $GITHUB_REF"
          echo "Branch: ${GITHUB_REF##*/}"
          echo "Release: ${RELEASE}"
          echo "Release version: ${RELEASE_VERSION}"
          echo "=========================="

      - name: Validate parameters and build type
        shell: bash
        run: |
          DIST_TAG=
          if [[ ${{ github.ref_type }} == "tag" ]]; then
            RELEASE_MODE=true
          fi
          if [[ ${RELEASE_MODE} == "true" ]]; then
            echo "[INFO] preparing to build and release with version: ${RELEASE_VERSION}"
            DIST_TAG=latest
            echo "[INFO] using ${DIST_TAG} tag for release"
          else
              DIST_TAG=next
              echo "[INFO] using "${DIST_TAG}" tag for development build"
          fi
          echo "NPM_DIST_TAG=$DIST_TAG" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@eclipse-che'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Set publish version
        run: |
          if [[ "${NPM_DIST_TAG}" == "next" ]]; then
            BASE_VERSION=$(node -p "require('./package.json').version" | sed 's/-.*//')
            PUBLISH_VERSION="${BASE_VERSION}-next.${GITHUB_SHA:0:7}"
            echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> $GITHUB_ENV
            npm version "${PUBLISH_VERSION}" --no-git-tag-version
          else
            PUBLISH_VERSION=$(node -p "require('./package.json').version")
            echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> $GITHUB_ENV
          fi
          echo "[INFO] Will publish version: ${PUBLISH_VERSION} with tag: ${NPM_DIST_TAG}"

      - name: Build and publish npmjs
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

          if npm view "@eclipse-che/license-tool@${PUBLISH_VERSION}" version 2>/dev/null | grep -q "${PUBLISH_VERSION}"; then
            echo "[INFO] Version ${PUBLISH_VERSION} already published on npm, skipping."
          else
            npm publish --tag "${NPM_DIST_TAG}" --access public --provenance
          fi
